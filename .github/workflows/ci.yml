name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  nix:
    uses: hakula139/devkit/.github/workflows/nix.yml@v3
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
    with:
      macos: false

  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Nix
        uses: hakula139/devkit/.github/actions/setup-nix@v3

      - name: Install dependencies
        run: nix develop -c pnpm install --frozen-lockfile

      - name: Build preview site
        run: nix develop -c pnpm build

  result:
    name: CI Result
    if: ${{ !cancelled() }}
    needs: [nix, check]
    runs-on: ubuntu-latest
    permissions:
      actions: read
    timeout-minutes: 5
    steps:
      - name: Check results
        uses: hakula139/devkit/.github/actions/ci-result@v3
