name = "IgnIt"
description = "A clean, feature-rich theme for kiln — inspired by Hugo LoveIt"
license = "MIT"
min_kiln_version = "0.1.0"

[author]
name = "Hakula"
link = "https://hakula.xyz"

[params]
cdn = "https://cdn.jsdelivr.net/npm"
code_max_lines = 40
emojis = true
fontawesome = true

# CDN dependencies — pinned versions + SRI hashes. See CLAUDE.md for the
# regeneration flow when bumping a version.
