name = "IgnIt"
description = "A clean, feature-rich theme for kiln, inspired by Hugo LoveIt"
license = "MIT"
min_kiln_version = "0.5.2"

[author]
name = "Hakula"
link = "https://hakula.xyz"

[css]
processor = "tailwind"

[params]
cdn = "https://cdn.jsdelivr.net/npm"
code_max_lines = 40
emojis = true
fontawesome = true
table_nowrap_width = 30

[params.comments]
provider = "twikoo"

# CDN dependencies, pinned to exact versions with SRI hashes.
# See AGENTS.md for the regeneration flow when bumping a version.
[params.deps.fontawesome]
version = "7.3.1"

[params.deps.fontawesome.sri]
css = "sha384-qrALq7+6jBOZIQsNnT6xGkMDru64qD6uTlDra39xrt2SoXl4pO3FX6Roz/RpR/BS"

[params.deps.katex]
version = "0.19.1"

[params.deps.katex.sri]
