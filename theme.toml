name = "IgnIt"
description = "A clean, feature-rich theme for kiln — inspired by Hugo LoveIt"
license = "MIT"
min_kiln_version = "0.3.0-rc.3"

[author]
name = "Hakula"
link = "https://hakula.xyz"

[params]
cdn = "https://cdn.jsdelivr.net/npm"
code_max_lines = 40
emojis = true
fontawesome = true

[params.effects]
# Cursor-tracking glow on glass panels. Off by default — see README
# (Visual Effects) for the rendering caveats before enabling.
cursor_glow = false

# CDN dependencies — pinned versions + SRI hashes.
# See CLAUDE.md for the regeneration flow when bumping a version.
[params.deps.fontawesome]
version = "7.3.1"

[params.deps.fontawesome.sri]
css = "sha384-qrALq7+6jBOZIQsNnT6xGkMDru64qD6uTlDra39xrt2SoXl4pO3FX6Roz/RpR/BS"

[params.deps.katex]
