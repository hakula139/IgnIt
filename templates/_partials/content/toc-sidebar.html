{# Desktop TOC sidebar (sticky, xl only) #}
{%- from "_partials/layout/glass-card.html" import glass_card %}
{%- if toc %}
<aside class="toc-sidebar-wrapper">
  {% call glass_card(glow_class="sticky top-22", panel_class="toc-sidebar") %}
      <h2 class="toc-sidebar-title">{{ t('table_of_contents') }}</h2>
      <div class="toc-sidebar-scroll">
        {{ toc | safe }}
      </div>
  {% endcall %}
</aside>
{%- endif %}
