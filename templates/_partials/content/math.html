{%- set cdn = config.params.cdn -%}
{%- set katex = config.params.deps.katex -%}
{%- if assets is defined and "math" in assets.features %}
  <script src="{{ cdn | safe }}/katex@{{ katex.version }}/dist/katex.min.js" defer></script>
  <script
    src="{{ cdn | safe }}/katex@{{ katex.version }}/dist/contrib/auto-render.min.js"
    defer
    onload="renderMathInElement(document.body)"
  ></script>
{%- endif %}
