    <article class="post-entry">
      <a
        href="{{ page.url | safe }}"
        class="animated-underline post-entry-title"
      >{{ page.title }}</a>
      {%- if page.date %}
      <time datetime="{{ page.date }}" class="post-entry-date">
        {{- page.date[5:10] -}}
      </time>
      {%- endif %}
    </article>
