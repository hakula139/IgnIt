{%- macro script(src, integrity) -%}
  <script
    src="{{ src }}"
    integrity="{{ integrity }}"
    crossorigin="anonymous"
    defer
  ></script>
{%- endmacro %}

{%- macro stylesheet(href, integrity) -%}
  <link
    rel="stylesheet"
    href="{{ href }}"
    integrity="{{ integrity }}"
    crossorigin="anonymous"
  >
{%- endmacro %}
