{# Per-post Twikoo mount. KaTeX always-on so commenters can use math anywhere. #}
{%- set cdn = config.params.cdn -%}
{%- set tw = config.params.comments.twikoo -%}
{%- set katex = config.params.deps.katex -%}
{%- set tw_dep = config.params.deps.twikoo -%}
<div class="glass-glow">
  <section class="glass-panel p-6 sm:p-8" aria-label="{{ t('comments_heading') }}">
    <div
      id="twikoo"
      class="prose max-w-none"
      data-twikoo-api-url="{{ tw.api_url }}"
    ></div>
  </section>
</div>

<script src="{{ cdn | safe }}/katex@{{ katex.version }}/dist/katex.min.js" defer></script>
<script src="{{ cdn | safe }}/katex@{{ katex.version }}/dist/contrib/auto-render.min.js" defer></script>
<script
  src="{{ cdn | safe }}/twikoo@{{ tw_dep.version }}/dist/twikoo.min.js"
  integrity="{{ tw_dep.sri }}"
  crossorigin="anonymous"
  defer
></script>
<script src="{{ config.base_url | safe }}/js/comments/twikoo.js" defer></script>
