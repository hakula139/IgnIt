{%- set comments = config.params.comments | default(value={}) -%}
{%- if comments.enabled %}
  <section id="comments" aria-label="{{ t('comments') }}">
    {%- if comments.provider == "twikoo" %}
      {%- include "_partials/comments/twikoo.html" %}
    {%- endif %}
  </section>

  <button
    id="jump-to-comments"
    class="float-btn jump-to-comments glass-panel"
    data-glow-target
    aria-label="{{ t('jump_to_comments') }}"
    title="{{ t('jump_to_comments') }}"
  >
    <i class="far fa-comment" aria-hidden="true"></i>
  </button>
{%- endif %}
