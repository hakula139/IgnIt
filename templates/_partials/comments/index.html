{# Per-post comments dispatcher. Add sibling partials per provider; this stays thin. #}
{%- set comments = config.params.comments | default(value={}) -%}
{%- if comments.enabled and comments.provider == "twikoo" %}
  {%- include "_partials/comments/twikoo.html" %}
  <button
    id="jump-to-comments"
    class="float-btn jump-to-comments glass-panel"
    data-glow-target
    aria-label="{{ t('jump_to_comments') }}"
    title="{{ t('jump_to_comments') }}"
  >
    <i class="far fa-comment-dots" aria-hidden="true"></i>
  </button>
{%- endif %}
