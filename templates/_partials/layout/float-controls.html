<div class="float-rail">
  <div class="float-controls">
    <a
      id="back-to-top"
      href="#"
      class="float-btn glass-panel"
      data-glow-target
      aria-label="{{ t('back_to_top') }}"
      title="{{ t('back_to_top') }}"
      hidden
    >
      <i class="fas fa-arrow-up" aria-hidden="true"></i>
    </a>

    {%- if content is defined and config.params.comments and config.params.comments.enabled %}
    <a
      id="jump-to-comments"
      href="#comments"
      class="float-btn glass-panel"
      data-glow-target
      aria-label="{{ t('jump_to_comments') }}"
      title="{{ t('jump_to_comments') }}"
      hidden
    >
      <i class="far fa-comment" aria-hidden="true"></i>
    </a>
    {%- endif %}
  </div>
</div>
